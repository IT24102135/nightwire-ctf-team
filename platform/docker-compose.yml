version: '3'
services:
  ctfd:
    image: ctfd/ctfd:latest
    user: root:root
    restart: always
    ports:
      - "8000:8000"
    environment:
      - FLASK_ENV=production
      - DATABASE_URL=mysql+pymysql://ctfd:ctfd@db/ctfd
      - REDIS_URL=redis://cache:6379
      - WORKERS=4
      - LOG_FOLDER=/var/log/CTFd
    volumes:
      - ctfd-uploads:/opt/CTFd/CTFd/uploads
      - ./scores-init.py:/opt/CTFd/CTFd/utils/scores/__init__.py
    depends_on:
      - db
      - cache
    networks:
      - internal

  db:
    image: mariadb:latest
    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD=ctfd
      - MYSQL_USER=ctfd
      - MYSQL_PASSWORD=ctfd
      - MYSQL_DATABASE=ctfd
    ports:
      - "3306:3306"
    volumes:
      - ctfd-db:/var/lib/mysql
    networks:
      - internal

  cache:
    image: redis:latest
    restart: always
    networks:
      - internal

volumes:
  ctfd-db:
  ctfd-uploads:

networks:
  internal:
    driver: bridge
